name: Build & Release EM CLIENT Real Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Project with Real Xray/Sing-box Core & RX UI
        run: |
          mkdir -p app/src/main/java/com/em/client
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "EM-Client"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.em.client'
              compileSdk 35

              defaultConfig {
                  applicationId "com.em.client"
                  versionCode 5
                  versionName "3.0.0"
              }

              flavorDimensions "osTarget"
              productFlavors {
                  android14Plus {
                      dimension "osTarget"
                      minSdk 34
                      targetSdk 35
                      versionNameSuffix "-Android14Plus"
                      ndk { abiFilters "arm64-v8a" }
                  }
                  android14Below {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 33
                      versionNameSuffix "-Android14Below"
                      ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
                  }
                  universal {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 34
                      versionNameSuffix "-Universal"
                      ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }
          dependencies {
              implementation 'com.github.2dust:AndroidLibXrayLite:v1.8.24'
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
          }
          EOF

