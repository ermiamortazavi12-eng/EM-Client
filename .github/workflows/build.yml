          fun parseUriToNode(raw: String, isSub: Boolean): ConfigNode {
              val proto = when {
                  raw.startsWith("vless://", true) -> "VLESS"
                  raw.startsWith("vmess://", true) -> "VMESS"
                  raw.contains("[Interface]", true) || raw.startsWith("wg://", true) -> "WIREGUARD"
                  else -> "CUSTOM"
              }
              var remark = raw.substringAfter("#", "").ifBlank { "$proto Node" }
              var host = "1.1.1.1"
              var port = 443

              if (proto == "VLESS") {
                  val hostPart = raw.substringAfter("@", "").substringBefore(":")
                  if (hostPart.contains(".")) host = hostPart
                  val portStr = raw.substringAfter("@", "").substringAfter(":", "").takeWhile { it.isDigit() }
                  port = portStr.toIntOrNull() ?: 443
              } else if (proto == "VMESS") {
                  try {
                      val b64 = raw.removePrefix("vmess://").substringBefore("#").trim()
                      val decoded = String(android.util.Base64.decode(b64, android.util.Base64.DEFAULT), Charsets.UTF_8)
                      val j = org.json.JSONObject(decoded)
                      host = j.optString("add", "1.1.1.1")
                      port = j.optInt("port", 443)
                      remark = j.optString("ps", remark)
                  } catch (_: Exception) {}
              } else if (proto == "WIREGUARD") {
                  val ep = raw.lines().find { it.trim().startsWith("Endpoint", true) }?.substringAfter("=")?.trim() ?: ""
                  if (ep.contains(":")) {
                      host = ep.substringBeforeLast(":")
                      port = ep.substringAfterLast(":").toIntOrNull() ?: 51820
                  }
              }

              return ConfigNode(
                  id = "${System.nanoTime()}",
                  name = try { java.net.URLDecoder.decode(remark, "UTF-8") } catch (_: Exception) { remark },
                  protocol = proto,
                  host = host,
                  port = port,
                  rawUri = raw,
                  isSub = isSub
              )
          }
          EOF

      - name: Build All 3 APK Variants
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleAndroid14PlusDebug assembleAndroid14BelowDebug assembleUniversalDebug --stacktrace
          mkdir -p release_apks
          cp app/build/outputs/apk/android14Plus/debug/*.apk release_apks/EM-Client_3.0.0_Android14Plus.apk
          cp app/build/outputs/apk/android14Below/debug/*.apk release_apks/EM-Client_3.0.0_Android14Below.apk
          cp app/build/outputs/apk/universal/debug/*.apk release_apks/EM-Client_3.0.0_Universal.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: EM CLIENT v3.0.0 (Sing-box Core + Liquid Glass)
          body: |
            ### نسخه‌های رسمی EM CLIENT v3.0.0 (مجهز به هسته واقعی Sing-box)
            - **EM-Client_3.0.0_Android14Plus.apk**: مخصوص گوشی‌های اندروید ۱۴، ۱۵ و بالاتر
            - **EM-Client_3.0.0_Android14Below.apk**: مخصوص گوشی‌های اندروید ۷ تا ۱۳
            - **EM-Client_3.0.0_Universal.apk**: نسخه جامع قابل نصب روی تمام دستگاه‌های اندرویدی
          files: |
            release_apks/EM-Client_3.0.0_Android14Plus.apk
            release_apks/EM-Client_3.0.0_Android14Below.apk
            release_apks/EM-Client_3.0.0_Universal.apk
