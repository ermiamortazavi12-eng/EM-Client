name: Build & Publish EM CLIENT Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Multi-Flavor Project (Android 14+, 14-, Universal)
        run: |
          mkdir -p app/src/main/java/com/em/client
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EM-Client"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.em.client'
              compileSdk 35

              defaultConfig {
                  applicationId "com.em.client"
                  versionCode 4
                  versionName "2.1.0"
              }

              flavorDimensions "osTarget"
              productFlavors {
                  android14Plus {
                      dimension "osTarget"
                      minSdk 34
                      targetSdk 35
                      versionNameSuffix "-Android14Plus"
                      ndk {
                          abiFilters "arm64-v8a"
                      }
                  }
                  android14Below {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 33
                      versionNameSuffix "-Android14Below"
                      ndk {
                          abiFilters "armeabi-v7a", "arm64-v8a"
                      }
                  }
                  universal {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 34
                      versionNameSuffix "-Universal"
                      ndk {
                          abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
                      }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#07090D" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#2A3441" android:strokeWidth="1.2"
                  android:pathData="M54,14 A40,40 0 1,1 53.9,14 Z"/>
              <path android:strokeColor="#64748B" android:strokeWidth="0.6"
                  android:pathData="M54,20 A34,34 0 1,1 53.9,20 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2.4"
                  android:pathData="M54,24 A30,30 0 1,1 53.9,24 Z"/>
              <path android:strokeColor="#94A3B8" android:strokeWidth="1"
                  android:pathData="M54,28 A26,26 0 1,1 53.9,28 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M35,44 H50 V48 H39.5 V52 H48.5 V56 H39.5 V60 H50 V64 H35 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,44 H58.5 L63.5,53 L68.5,44 H73 V64 H68.8 V51.5 L63.5,60.5 L58.2,51.5 V64 H54 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="EM CLIENT"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".EmVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/em/client/EmVpnService.kt
          package com.em.client

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat

          class EmVpnService : VpnService() {
              private var vpnInterface: ParcelFileDescriptor? = null

              companion object {
                  const val ACTION_CONNECT = "com.em.client.CONNECT"
                  const val ACTION_DISCONNECT = "com.em.client.DISCONNECT"
                  var isRunning = false
                  var currentConfig = ""
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_CONNECT -> {
                          currentConfig = intent.getStringExtra("CONFIG") ?: ""
                          startVpnTunnel()
                      }
                      ACTION_DISCONNECT -> stopVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  if (isRunning) return
                  createNotificationChannel()
                  val notification = NotificationCompat.Builder(this, "EM_VPN_CHANNEL")
                      .setContentTitle("EM CLIENT")
                      .setContentText("متصل • تونل امن Liquid Glass فعال است")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      ServiceCompat.startForeground(
                          this, 1, notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(1, notification)
                  }

                  val builder = Builder()
                      .setSession("EM CLIENT")
                      .setMtu(1500)
                      .addAddress("172.19.0.1", 30)
                      .addDnsServer("1.1.1.1")
                      .addRoute("0.0.0.0", 0)

                  try { builder.addDisallowedApplication(packageName) } catch (_: Exception) {}

                  vpnInterface = builder.establish()
                  isRunning = vpnInterface != null
              }

              private fun stopVpnTunnel() {
                  isRunning = false
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "EM_VPN_CHANNEL", "EM CLIENT VPN",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }
          EOF

          FOUND_MAIN=$(find . -iname "MainActivity.kt" | head -n 1)
          if [ -n "$FOUND_MAIN" ] && [ "$FOUND_MAIN" != "./app/src/main/java/com/em/client/MainActivity.kt" ]; then
            cp "$FOUND_MAIN" app/src/main/java/com/em/client/MainActivity.kt
          fi

      - name: Build All 3 APK Variants
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleAndroid14PlusDebug assembleAndroid14BelowDebug assembleUniversalDebug --stacktrace
          mkdir -p release_apks
          cp app/build/outputs/apk/android14Plus/debug/*.apk release_apks/EM-Client_2.1.0_Android14Plus.apk
          cp app/build/outputs/apk/android14Below/debug/*.apk release_apks/EM-Client_2.1.0_Android14Below.apk
          cp app/build/outputs/apk/universal/debug/*.apk release_apks/EM-Client_2.1.0_Universal.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: EM CLIENT v2.1.0 (Liquid Glass Edition)
          body: |
            ### نسخه‌های رسمی EM CLIENT
            - **EM-Client_2.1.0_Android14Plus.apk**: مخصوص گوشی‌های اندروید ۱۴، ۱۵ و بالاتر
            - **EM-Client_2.1.0_Android14Below.apk**: مخصوص گوشی‌های اندروید ۷ تا ۱۳
            - **EM-Client_2.1.0_Universal.apk**: نسخه جامع قابل نصب روی تمام دستگاه‌های اندرویدی
          files: |
            release_apks/EM-Client_2.1.0_Android14Plus.apk
            release_apks/EM-Client_2.1.0_Android14Below.apk
            release_apks/EM-Client_2.1.0_Universal.apk
