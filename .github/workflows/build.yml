name: Build EM CLIENT APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Repair All File Paths
        run: |
          mkdir -p app/src/main/java/com/em/client
          
          # Find and place AndroidManifest.xml
          MANIFEST=$(find . -iname "AndroidManifest.xml" | head -n 1)
          if [ -n "$MANIFEST" ] && [ "$MANIFEST" != "./app/src/main/AndroidManifest.xml" ]; then
            cp "$MANIFEST" app/src/main/AndroidManifest.xml
          fi

          # Find and place Kotlin source files
          for KT in MainActivity.kt EmVpnService.kt; do
            FOUND_KT=$(find . -iname "$KT" | head -n 1)
            if [ -n "$FOUND_KT" ] && [ "$FOUND_KT" != "./app/src/main/java/com/em/client/$KT" ]; then
              cp "$FOUND_KT" "app/src/main/java/com/em/client/$KT"
            fi
          done

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

      - name: Build EM CLIENT APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload EM-Client.apk
        uses: actions/upload-artifact@v4
        with:
          name: EM-Client-APK
          path: app/build/outputs/apk/debug/app-debug.apk
