name: Build & Release EM CLIENT Real Core

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Real Sing-box Core (libbox)
        run: |
          mkdir -p app/libs
          curl -L -f -o app/libs/libbox.aar https://github.com/SagerNet/sing-box/releases/download/v1.10.1/libbox-1.10.1.aar

      - name: Generate Complete Project with Real Sing-box & RX UI
        run: |
          mkdir -p app/src/main/java/com/em/client
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  flatDir { dirs 'app/libs' }
              }
          }
          rootProject.name = "EM-Client"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.em.client'
              compileSdk 35

              defaultConfig {
                  applicationId "com.em.client"
                  versionCode 5
                  versionName "3.0.0"
              }

              flavorDimensions "osTarget"
              productFlavors {
                  android14Plus {
                      dimension "osTarget"
                      minSdk 34
                      targetSdk 35
                      versionNameSuffix "-Android14Plus"
                      ndk { abiFilters "arm64-v8a" }
                  }
                  android14Below {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 33
                      versionNameSuffix "-Android14Below"
                      ndk { abiFilters "armeabi-v7a", "arm64-v8a" }
                  }
                  universal {
                      dimension "osTarget"
                      minSdk 24
                      targetSdk 34
                      versionNameSuffix "-Universal"
                      ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              buildFeatures {
                  compose true
              }
              composeOptions {
                  kotlinCompilerExtensionVersion '1.5.8'
              }
          }
          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
              implementation 'androidx.activity:activity-compose:1.8.2'
              implementation platform('androidx.compose:compose-bom:2024.02.00')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.ui:ui-graphics'
              implementation 'androidx.compose.material3:material3'
              implementation 'androidx.compose.material:material-icons-extended'
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # Custom Monochrome Liquid Glass Launcher Icon (EM CLIENT)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_bg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#07090D" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#2A3441" android:strokeWidth="1.2"
                  android:pathData="M54,14 A40,40 0 1,1 53.9,14 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_launcher_fg.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:strokeColor="#FFFFFF" android:strokeWidth="2.4"
                  android:pathData="M54,24 A30,30 0 1,1 53.9,24 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M35,44 H50 V48 H39.5 V52 H48.5 V56 H39.5 V60 H50 V64 H35 Z"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,44 H58.5 L63.5,53 L68.5,44 H73 V64 H68.8 V51.5 L63.5,60.5 L58.2,51.5 V64 H54 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF

          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="EM CLIENT"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".EmVpnService"
                      android:exported="false"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:foregroundServiceType="specialUse">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="vpn" />
                  </service>
              </application>
          </manifest>
          EOF

          # Config Parser (Converts VLESS / VMess / WireGuard URIs into Sing-box JSON)
          cat << 'EOF' > app/src/main/java/com/em/client/SingBoxConfigBuilder.kt
          package com.em.client

          import android.net.Uri
          import android.util.Base64
          import org.json.JSONArray
          import org.json.JSONObject

          object SingBoxConfigBuilder {

              fun buildSingBoxJson(rawInput: String): String {
                  val trimmed = rawInput.trim()
                  if (trimmed.startsWith("{")) return trimmed

                  val outbound = when {
                      trimmed.startsWith("vless://", true) -> parseVless(trimmed)
                      trimmed.startsWith("vmess://", true) -> parseVmess(trimmed)
                      trimmed.contains("[Interface]", true) || trimmed.startsWith("wg://", true) -> parseWireGuard(trimmed)
                      else -> throw IllegalArgumentException("فرمت کانفیگ پشتیبانی نمی‌شود")
                  }

                  val root = JSONObject()
                  root.put("log", JSONObject().put("level", "error"))

                  val dns = JSONObject()
                      .put("servers", JSONArray()
                          .put(JSONObject().put("tag", "google").put("address", "https://8.8.8.8/dns-query").put("detour", "proxy"))
                          .put(JSONObject().put("tag", "local").put("address", "223.5.5.5").put("detour", "direct"))
                      )
                  root.put("dns", dns)

                  val tunInbound = JSONObject()
                      .put("type", "tun")
                      .put("tag", "tun-in")
                      .put("inet4_address", "172.19.0.1/30")
                      .put("mtu", 1500)
                      .put("auto_route", true)
                      .put("strict_route", false)
                      .put("sniff", true)

                  root.put("inbounds", JSONArray().put(tunInbound))

                  val outbounds = JSONArray()
                      .put(outbound)
                      .put(JSONObject().put("type", "direct").put("tag", "direct"))
                      .put(JSONObject().put("type", "dns").put("tag", "dns-out"))
                  root.put("outbounds", outbounds)

                  val route = JSONObject()
                      .put("auto_detect_interface", true)
                      .put("rules", JSONArray()
                          .put(JSONObject().put("protocol", "dns").put("outbound", "dns-out"))
                      )
                  root.put("route", route)

                  return root.toString(2)
              }

              private fun parseVless(uriStr: String): JSONObject {
                  val uri = Uri.parse(uriStr)
                  val uuid = uri.userInfo ?: ""
                  val host = uri.host ?: ""
                  val port = if (uri.port > 0) uri.port else 443
                  val security = uri.getQueryParameter("security") ?: "none"
                  val sni = uri.getQueryParameter("sni") ?: uri.getQueryParameter("peer") ?: host
                  val fp = uri.getQueryParameter("fp") ?: "chrome"
                  val type = uri.getQueryParameter("type") ?: "tcp"
                  val path = uri.getQueryParameter("path") ?: "/"
                  val hostHeader = uri.getQueryParameter("host") ?: sni
                  val pbk = uri.getQueryParameter("pbk") ?: ""
                  val sid = uri.getQueryParameter("sid") ?: ""

                  val out = JSONObject()
                      .put("type", "vless")
                      .put("tag", "proxy")
                      .put("server", host)
                      .put("server_port", port)
                      .put("uuid", uuid)

                  if (security == "tls" || security == "reality") {
                      val tls = JSONObject()
                          .put("enabled", true)
                          .put("server_name", sni)
                          .put("utls", JSONObject().put("enabled", true).put("fingerprint", fp))
                      if (security == "reality") {
                          tls.put("reality", JSONObject().put("enabled", true).put("public_key", pbk).put("short_id", sid))
                      }
                      out.put("tls", tls)
                  }

                  when (type) {
                      "ws" -> {
                          val transport = JSONObject().put("type", "ws").put("path", path)
                          if (hostHeader.isNotEmpty()) {
                              transport.put("headers", JSONObject().put("Host", hostHeader))
                          }
                          out.put("transport", transport)
                      }
                      "grpc" -> {
                          val serviceName = uri.getQueryParameter("serviceName") ?: ""
                          out.put("transport", JSONObject().put("type", "grpc").put("service_name", serviceName))
                      }
                  }
                  return out
              }

              private fun parseVmess(uriStr: String): JSONObject {
                  val b64 = uriStr.removePrefix("vmess://").substringBefore("#").trim()
                  val decoded = String(Base64.decode(b64, Base64.DEFAULT), Charsets.UTF_8)
                  val j = JSONObject(decoded)
                  val host = j.optString("add")
                  val port = j.optInt("port", 443)
                  val uuid = j.optString("id")
                  val aid = j.optInt("aid", 0)
                  val net = j.optString("net", "tcp")
                  val tlsMode = j.optString("tls", "")
                  val sni = j.optString("sni").ifBlank { j.optString("host").ifBlank { host } }
                  val path = j.optString("path", "/")
                  val hostHeader = j.optString("host", sni)

                  val out = JSONObject()
                      .put("type", "vmess")
                      .put("tag", "proxy")
                      .put("server", host)
                      .put("server_port", port)
                      .put("uuid", uuid)
                      .put("alter_id", aid)
                      .put("security", "auto")

                  if (tlsMode == "tls") {
                      out.put("tls", JSONObject().put("enabled", true).put("server_name", sni))
                  }
                  if (net == "ws") {
                      val transport = JSONObject().put("type", "ws").put("path", path)
                      if (hostHeader.isNotEmpty()) {
                          transport.put("headers", JSONObject().put("Host", hostHeader))
                      }
                      out.put("transport", transport)
                  }
                  return out
              }

              private fun parseWireGuard(conf: String): JSONObject {
                  var privateKey = ""
                  var address = "10.0.0.2/32"
                  var peerPublicKey = ""
                  var endpointHost = ""
                  var endpointPort = 51820

                  conf.lines().forEach { rawLine ->
                      val line = rawLine.trim()
                      when {
                          line.startsWith("PrivateKey", true) -> privateKey = line.substringAfter("=").trim()
                          line.startsWith("Address", true) -> address = line.substringAfter("=").substringBefore(",").trim()
                          line.startsWith("PublicKey", true) -> peerPublicKey = line.substringAfter("=").trim()
                          line.startsWith("Endpoint", true) -> {
                              val ep = line.substringAfter("=").trim()
                              endpointHost = ep.substringBeforeLast(":")
                              endpointPort = ep.substringAfterLast(":").toIntOrNull() ?: 51820
                          }
                      }
                  }

                  return JSONObject()
                      .put("type", "wireguard")
                      .put("tag", "proxy")
                      .put("server", endpointHost)
                      .put("server_port", endpointPort)
                      .put("local_address", JSONArray().put(address))
                      .put("private_key", privateKey)
                      .put("peer_public_key", peerPublicKey)
                      .put("mtu", 1420)
              }
          }
          EOF

          # Real Sing-box VPN Service Implementation
          cat << 'EOF' > app/src/main/java/com/em/client/EmVpnService.kt
          package com.em.client

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.net.VpnService
          import android.os.Build
          import android.os.ParcelFileDescriptor
          import android.util.Log
          import androidx.core.app.NotificationCompat
          import androidx.core.app.ServiceCompat
          import io.nekohasekai.libbox.BoxService
          import io.nekohasekai.libbox.InterfaceUpdateListener
          import io.nekohasekai.libbox.Libbox
          import io.nekohasekai.libbox.LocalDNSTransport
          import io.nekohasekai.libbox.NetworkInterfaceIterator
          import io.nekohasekai.libbox.PlatformInterface
          import io.nekohasekai.libbox.SetupOptions
          import io.nekohasekai.libbox.StringIterator
          import io.nekohasekai.libbox.TunOptions
          import io.nekohasekai.libbox.WIFIState
          import java.io.File

          class EmVpnService : VpnService(), PlatformInterface {
              private var vpnInterface: ParcelFileDescriptor? = null
              private var boxService: BoxService? = null

              companion object {
                  const val ACTION_CONNECT = "com.em.client.CONNECT"
                  const val ACTION_DISCONNECT = "com.em.client.DISCONNECT"
                  var isRunning = false
                  var lastError: String? = null
              }

              override fun onCreate() {
                  super.onCreate()
                  val baseDir = File(filesDir, "sing-box").apply { mkdirs() }
                  val workDir = File(baseDir, "work").apply { mkdirs() }
                  val tempDir = File(cacheDir, "sing-box-tmp").apply { mkdirs() }
                  val options = SetupOptions().apply {
                      basePath = baseDir.absolutePath
                      workingPath = workDir.absolutePath
                      tempPath = tempDir.absolutePath
                  }
                  try {
                      Libbox.setup(options)
                  } catch (e: Exception) {
                      Log.e("EM_VPN", "Libbox setup error", e)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_CONNECT -> {
                          val rawConfig = intent.getStringExtra("CONFIG") ?: ""
                          startSingBoxTunnel(rawConfig)
                      }
                      ACTION_DISCONNECT -> stopSingBoxTunnel()
                  }
                  return START_STICKY
              }

              private fun startSingBoxTunnel(rawConfig: String) {
                  if (isRunning) stopSingBoxTunnel()
                  lastError = null
                  createNotificationChannel()
                  val notification = NotificationCompat.Builder(this, "EM_VPN_CHANNEL")
                      .setContentTitle("EM CLIENT")
                      .setContentText("متصل • هسته Sing-box فعال است")
                      .setSmallIcon(android.R.drawable.ic_lock_lock)
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      ServiceCompat.startForeground(
                          this, 1, notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      )
                  } else {
                      startForeground(1, notification)
                  }

                  try {
                      val jsonConfig = SingBoxConfigBuilder.buildSingBoxJson(rawConfig)
                      val service = Libbox.newService(jsonConfig, this)
                      service.start()
                      boxService = service
                      isRunning = true
                  } catch (e: Exception) {
                      lastError = e.message ?: "خطا در اتصال هسته"
                      Log.e("EM_VPN", "Start failed", e)
                      stopSingBoxTunnel()
                  }
              }

              private fun stopSingBoxTunnel() {
                  isRunning = false
                  try { boxService?.close() } catch (_: Exception) {}
                  boxService = null
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun openTun(options: TunOptions): Int {
                  val builder = Builder()
                      .setSession("EM CLIENT")
                      .setMtu(options.mtu)
                      .addAddress("172.19.0.1", 30)
                      .addDnsServer("8.8.8.8")
                      .addRoute("0.0.0.0", 0)

                  try { builder.addDisallowedApplication(packageName) } catch (_: Exception) {}

                  val pfd = builder.establish() ?: throw IllegalStateException("Cannot establish TUN")
                  vpnInterface = pfd
                  return pfd.fd
              }

              override fun autoDetectInterfaceControl(fd: Int) {
                  protect(fd)
              }

              override fun usePlatformAutoDetectInterfaceControl(): Boolean = true
              override fun useProcFS(): Boolean = false
              override fun findConnectionOwner(p0: Int, p1: String?, p2: Int, p3: String?, p4: Int): Int = -1
              override fun packageNameByUid(uid: Int): String = packageManager.getNameForUid(uid) ?: ""
              override fun uidByPackageName(pkg: String): Int = try { packageManager.getApplicationInfo(pkg, 0).uid } catch (_: Exception) { -1 }
              override fun startDefaultInterfaceMonitor(p0: InterfaceUpdateListener?) {}
              override fun closeDefaultInterfaceMonitor(p0: InterfaceUpdateListener?) {}
              override fun getInterfaces(): NetworkInterfaceIterator? = null
              override fun underNetworkExtension(): Boolean = false
              override fun includeAllNetworks(): Boolean = false
              override fun clearDNSCache() {}
              override fun readWIFIState(): WIFIState? = null
              override fun localDNSTransport(): LocalDNSTransport? = null
              override fun systemCertificates(): StringIterator? = null
              override fun writeLog(message: String?) { Log.d("SingBox", message ?: "") }
              override fun sendNotification(p0: io.nekohasekai.libbox.Notification?) {}

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          "EM_VPN_CHANNEL", "EM CLIENT VPN",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)
                  }
              }

              override fun onDestroy() {
                  stopSingBoxTunnel()
                  super.onDestroy()
              }
          }
          EOF

          # New RX-Inspired Liquid Glass UI (Overwrites old MainActivity completely)
          cat << 'EOF' > app/src/main/java/com/em/client/MainActivity.kt
          package com.em.client

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.net.InetSocketAddress
          import java.net.Socket

          data class ConfigNode(
              val id: String,
              val name: String,
              val protocol: String,
              val host: String,
              val port: Int,
              val rawUri: String,
              val isSub: Boolean = false,
              var pingMs: Int = 0
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                          EmClientProApp()
                      }
                  }
              }
          }

          @Composable
          fun EmClientProApp() {
              val context = LocalContext.current
              val clipboard = LocalClipboardManager.current
              val scope = rememberCoroutineScope()
              val drawerState = rememberDrawerState(DrawerValue.Closed)

              var isConnected by remember { mutableStateOf(EmVpnService.isRunning) }
              var selectedTab by remember { mutableIntStateOf(0) }
              var showSearch by remember { mutableStateOf(false) }
              var searchQuery by remember { mutableStateOf("") }
              var showAddMenu by remember { mutableStateOf(false) }
              var showMoreMenu by remember { mutableStateOf(false) }
              var showManualDialog by remember { mutableStateOf(false) }
              var manualInput by remember { mutableStateOf("") }

              val configs = remember { mutableStateListOf<ConfigNode>() }
              var selectedId by remember { mutableStateOf<String?>(null) }

              val filePicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.GetContent()
              ) { uri ->
                  uri?.let {
                      try {
                          val text = context.contentResolver.openInputStream(it)?.bufferedReader()?.use { r -> r.readText() } ?: ""
                          if (text.isNotBlank()) {
                              if (text.contains("[Interface]", true)) {
                                  val node = parseUriToNode(text, selectedTab == 1)
                                  configs.add(0, node)
                                  selectedId = node.id
                              } else {
                                  val lines = text.lines().map { l -> l.trim() }.filter { l -> l.isNotEmpty() }
                                  lines.forEach { line -> configs.add(parseUriToNode(line, selectedTab == 1)) }
                                  if (selectedId == null && configs.isNotEmpty()) selectedId = configs.first().id
                              }
                              Toast.makeText(context, "کانفیگ از فایل اضافه شد", Toast.LENGTH_SHORT).show()
                          }
                      } catch (_: Exception) {
                          Toast.makeText(context, "خطا در خواندن فایل", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              val vpnPermissionLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == Activity.RESULT_OK) {
                      val activeNode = configs.find { it.id == selectedId }
                      val intent = Intent(context, EmVpnService::class.java).apply {
                          action = EmVpnService.ACTION_CONNECT
                          putExtra("CONFIG", activeNode?.rawUri ?: "")
                      }
                      context.startForegroundService(intent)
                      scope.launch {
                          delay(500)
                          isConnected = EmVpnService.isRunning
                          if (!isConnected && EmVpnService.lastError != null) {
                              Toast.makeText(context, EmVpnService.lastError, Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              fun importFromClipboard() {
                  val clip = clipboard.getText()?.text?.trim() ?: ""
                  if (clip.isEmpty()) {
                      Toast.makeText(context, "کلیپ‌بورد خالی است!", Toast.LENGTH_SHORT).show()
                      return
                  }
                  if (clip.contains("[Interface]", true)) {
                      val node = parseUriToNode(clip, selectedTab == 1)
                      configs.add(0, node)
                      selectedId = node.id
                      Toast.makeText(context, "کانفیگ WireGuard وارد شد", Toast.LENGTH_SHORT).show()
                  } else {
                      val lines = clip.lines().map { it.trim() }.filter { it.isNotEmpty() }
                      lines.forEach { line -> configs.add(0, parseUriToNode(line, selectedTab == 1)) }
                      if (configs.isNotEmpty()) selectedId = configs.first().id
                      Toast.makeText(context, "${lines.size} کانفیگ وارد شد", Toast.LENGTH_SHORT).show()
                  }
              }

              fun testAllPings() {
                  if (configs.isEmpty()) {
                      Toast.makeText(context, "کانفیگی برای تست وجود ندارد", Toast.LENGTH_SHORT).show()
                      return
                  }
                  scope.launch {
                      Toast.makeText(context, "در حال تست پینگ سرورها...", Toast.LENGTH_SHORT).show()
                      for (i in configs.indices) {
                          val item = configs[i]
                          val latency = withContext(Dispatchers.IO) {
                              try {
                                  val start = System.currentTimeMillis()
                                  Socket().use { s -> s.connect(InetSocketAddress(item.host, item.port), 1500) }
                                  (System.currentTimeMillis() - start).toInt()
                              } catch (_: Exception) {
                                  -1
                              }
                          }
                          configs[i] = item.copy(pingMs = latency)
                      }
                      Toast.makeText(context, "تست پینگ انجام شد", Toast.LENGTH_SHORT).show()
                  }
              }

              fun toggleConnection() {
                  if (isConnected) {
                      val intent = Intent(context, EmVpnService::class.java).apply {
                          action = EmVpnService.ACTION_DISCONNECT
                      }
                      context.startService(intent)
                      isConnected = false
                  } else {
                      if (configs.isEmpty()) {
                          Toast.makeText(context, "ابتدا یک کانفیگ اضافه کنید", Toast.LENGTH_SHORT).show()
                          return
                      }
                      val activeNode = configs.find { it.id == selectedId } ?: configs.first()
                      selectedId = activeNode.id
                      val prepareIntent = VpnService.prepare(context)
                      if (prepareIntent != null) {
                          vpnPermissionLauncher.launch(prepareIntent)
                      } else {
                          val intent = Intent(context, EmVpnService::class.java).apply {
                              action = EmVpnService.ACTION_CONNECT
                              putExtra("CONFIG", activeNode.rawUri)
                          }
                          context.startForegroundService(intent)
                          scope.launch {
                              delay(500)
                              isConnected = EmVpnService.isRunning
                              if (!isConnected && EmVpnService.lastError != null) {
                                  Toast.makeText(context, EmVpnService.lastError, Toast.LENGTH_LONG).show()
                              }
                          }
                      }
                  }
              }

